name: Release

# Stages a release on npm when a version tag is pushed:
#
#   npm version patch      (bumps package.json, commits, tags v1.0.1)
#   git push origin main --follow-tags
#
# The maintainer approves the run on GitHub (the "npm" environment asks), and
# then the staged version under Staged Packages on npmjs.com, with 2FA. Only
# then does it go live.
#
# There is no npm token anywhere. npm trusts this workflow file, in this
# repository, running in the "npm" environment - and nothing else (trusted
# publishing, over OIDC) - and lets it stage, never publish. So whoever can
# push a tag here still cannot put a version in front of users without the
# maintainer's 2FA on npm. The environment only runs from v* tags.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: The tag names the version in package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run check

  # Kept apart from the checks: only this job can ask for the token that
  # stages, and it runs nothing of the package's own.
  stage:
    needs: check
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # staging needs npm 11.15 or later, newer than Node 24 may bring
      - run: npx --yes npm@11.21.1 stage publish --ignore-scripts
